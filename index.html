<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A brief description of my shiny new GitHub page">

  <!-- Add a custom icon if you have one -->
  <!-- <link rel="icon" type="image/png" href="favicon.png"> -->

  <title>My GitHub Page</title>

  <!-- Link to your CSS file -->
  <link rel="stylesheet" href="gonzalesgag.css">
  
  <!-- Add the script to view 3D Models -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
</head>
<body>

  <!-- Your main content goes here -->


  <main>


    <section>
      <h2>About Me</h2>
      <p>This is where I'll add my primary content, projects, or blog posts.</p>
    </section>

    <img src="images/final.png" alt="A brief description of your image" width="500">

    <section class="3d-viewer-window" style="margin-top: 2rem;">
      <h2>Interactive 3D Render</h2>
      <!-- To display your 3D model, change 'src' to point to your .glb or .gltf file -->
      <model-viewer 
        src="gallery.glb" 
        alt="A 3D render of my project" 
        auto-rotate 
        camera-controls 
        style="width: 100%; height: 500px; background-color: #fce4ec; border-radius: 15px; border: 2px solid #ff4081;">
      </model-viewer>
    </section>

  </main>

  <footer>
    <p>&copy; 2026 My Name. Hosted on GitHub Pages.</p>
  </footer>


</body>
</html>
