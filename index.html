<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A brief description of my shiny new GitHub page">

  <!-- Add a custom icon if you have one -->
  <!-- <link rel="icon" type="image/png" href="favicon.png"> -->

  <title>My GitHub Page</title>

  <!-- Link to your CSS file -->
  <link rel="stylesheet" href="gonzalesgag.css">

  <!-- Add the script to view 3D Models -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
</head>
<body>

  <!-- Your main content goes here -->
  <nav class="nav-buttons halftone-box">
    <button id="btn-about" class="jagged-btn btn-about active" onclick="showView('about')">About</button>
    <button id="btn-gallery" class="jagged-btn btn-gallery" onclick="showView('gallery')">Gallery</button>
    <button id="btn-viewer" class="jagged-btn btn-viewer" onclick="showView('viewer')">3D View</button>
  </nav>

  <main>

    <div id="about-view" class="view-content">
      <section class="halftone-box">
        <h2>About Me</h2>
        <p></p>
      </section>
    </div>

    <div id="gallery-view" class="view-content hidden-view">
      <header class="main-header halftone-box">
        <h1>10C Assignment 1: Large Format Print</h1>
      </header>
      <img src="images/final.png" alt="A brief description of your image" width="500" class="gallery-image">
    </div>
    <div id="gallery-view" class="view-content hidden-view">

      <section class="halftone-box">
        <h2>Project Drafts</h2>
        <p>Click on any draft thumbnail to expand it!</p>

        <div class="drafts-container">

          <button class="draft 1-01.tif" onclick="toggleExpand(this)">
            <img src="images/final.png" alt="Draft 1 Thumbnail">
          </button>

          </div>
      </section>

    </div>
    <div id="viewer-view" class="view-content hidden-view">
      <section class="3d-viewer-window halftone-box">
        <h2>Interactive 3D Render</h2>
        <!-- To display your 3D model, change 'src' to point to your .glb or .gltf file -->
        <model-viewer
          src="gallery.glb"
          alt="A 3D render of my project"
          auto-rotate
          camera-controls
          style="width: 100%; height: 500px; background-color: #fce4ec; border-radius: 15px; border: 2px solid #ff4081;">
        </model-viewer>
      </section>
    </div>

  </main>

  <footer>
    <p></p>
  </footer>

  <script>
    function showView(viewId) {
      // Hide all views
      document.querySelectorAll('.view-content').forEach(view => {
        view.classList.add('hidden-view');
      });
      // Deactivate all buttons
      document.querySelectorAll('.jagged-btn').forEach(btn => {
        btn.classList.remove('active');
      });

      // Show selected view
      const selectedView = document.getElementById(viewId + '-view');
      if (selectedView) {
        selectedView.classList.remove('hidden-view');
      }

      // Activate corresponding button
      const activeBtn = document.querySelector('.btn-' + viewId);
      if (activeBtn) {
        activeBtn.classList.add('active');
      }
    }
  </script>

</body>

</html>
